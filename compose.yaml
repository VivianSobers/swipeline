services:
  replayer:
    profiles: [core, full]
    image: swipeline-replayer:m1
    build:
      context: .
      dockerfile: deploy/replayer.Dockerfile
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      SWIPELINE_GATEWAY_URL: http://gateway:8081
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - preview-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, /swipeline, health]
      interval: 2s
      timeout: 4s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  prometheus:
    profiles: [core, full]
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:${SWIPELINE_PROM_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ./deploy/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          selinux: z
      - prometheus-data:/prometheus
    depends_on:
      replayer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  postgres:
    profiles: [core, full]
    image: postgres:17.11-bookworm
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_PASSWORD: admin-local
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=32, -c, synchronous_commit=on]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/postgres-init.sql
        target: /docker-entrypoint-initdb.d/001-gateway.sql
        read_only: true
        bind:
          selinux: z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  kafka:
    profiles: [core, full]
    image: apache/kafka:4.3.1
    mem_limit: 768m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      LOG_DIR: /tmp/kafka-logs
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id MkU3OEVBNTcwNTJENDM2Qk --config /etc/kafka/swipeline.properties
        rm -f /tmp/topics-ready
        /opt/kafka/bin/kafka-server-start.sh /etc/kafka/swipeline.properties &
        broker=$$!
        trap 'kill -TERM $$broker; wait $$broker' TERM INT
        until bash /opt/swipeline/topics.sh; do kill -0 $$broker; sleep 2; done
        touch /tmp/topics-ready
        wait $$broker
    volumes:
      - kafka-data:/var/lib/kafka/data
      - type: bind
        source: ./deploy/kafka.properties
        target: /etc/kafka/swipeline.properties
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./deploy/topics.sh
        target: /opt/swipeline/topics.sh
        read_only: true
        bind:
          selinux: z
    tmpfs:
      - /tmp:size=64m,mode=1777,exec
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/topics-ready && bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  gateway:
    profiles: [core, full]
    image: swipeline-gateway:m2
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://gateway:gateway-local@postgres:5432/gateway?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      GOMEMLIMIT: 192MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_GATEWAY_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, /gateway, health]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  flink-jobmanager:
    profiles: [core, full]
    image: swipeline-streaming:m2
    build:
      context: .
      dockerfile: deploy/streaming.Dockerfile
    mem_limit: 512m
    command: [standalone-job, --job-classname, io.swipeline.Authorization]
    environment:
      KAFKA_BROKERS: kafka:9092
      AUTH_PARALLELISM: "2"
    volumes:
      - flink-state:/state
    ports:
      - "127.0.0.1:${SWIPELINE_FLINK_PORT:-8082}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          job=$$(curl -fsS --max-time 2 http://127.0.0.1:8081/jobs/overview |
          grep -oE '\{[^{}]*"name"[[:space:]]*:[[:space:]]*"authorization"[^{}]*\{[^{}]*\}[^{}]*\}') &&
          printf '%s\n' "$$job" | grep -qE '"state"[[:space:]]*:[[:space:]]*"RUNNING"' &&
          for state in created scheduled deploying initializing reconciling; do
            printf '%s\n' "$$job" | grep -qE "\"$$state\"[[:space:]]*:[[:space:]]*0[[:space:]]*[,}]" || exit 1;
          done
      interval: 2s
      timeout: 3s
      start_period: 120s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  flink-taskmanager:
    profiles: [core, full]
    image: swipeline-streaming:m2
    mem_limit: 1536m
    command: [taskmanager]
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - flink-state:/state
    depends_on:
      flink-jobmanager:
        condition: service_started
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  preview-data:
  prometheus-data:
  postgres-data:
  kafka-data:
  flink-state:
