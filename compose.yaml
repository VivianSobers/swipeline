services:
  replayer:
    profiles: [core, full]
    image: swipeline-replayer:m1
    build:
      context: .
      dockerfile: deploy/replayer.Dockerfile
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      SWIPELINE_GATEWAY_URL: http://gateway:8081
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - preview-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, /swipeline, health]
      interval: 2s
      timeout: 4s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  prometheus:
    profiles: [core, full]
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:${SWIPELINE_PROM_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ./deploy/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          selinux: z
      - prometheus-data:/prometheus
    depends_on:
      replayer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  postgres:
    profiles: [core, full]
    image: postgres:17.11-bookworm
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_PASSWORD: admin-local
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=32, -c, synchronous_commit=on]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/postgres-init.sql
        target: /docker-entrypoint-initdb.d/001-gateway.sql
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./deploy/postgres-analytics-init.sql
        target: /docker-entrypoint-initdb.d/002-analytics.sql
        read_only: true
        bind:
          selinux: z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  kafka:
    profiles: [core, full]
    image: apache/kafka:4.3.1
    mem_limit: 768m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      LOG_DIR: /tmp/kafka-logs
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id MkU3OEVBNTcwNTJENDM2Qk --config /etc/kafka/swipeline.properties
        rm -f /tmp/topics-ready
        /opt/kafka/bin/kafka-server-start.sh /etc/kafka/swipeline.properties &
        broker=$$!
        trap 'kill -TERM $$broker; wait $$broker' TERM INT
        until bash /opt/swipeline/topics.sh; do kill -0 $$broker; sleep 2; done
        touch /tmp/topics-ready
        wait $$broker
    volumes:
      - kafka-data:/var/lib/kafka/data
      - type: bind
        source: ./deploy/kafka.properties
        target: /etc/kafka/swipeline.properties
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./deploy/topics.sh
        target: /opt/swipeline/topics.sh
        read_only: true
        bind:
          selinux: z
    tmpfs:
      - /tmp:size=64m,mode=1777,exec
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/topics-ready && bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  gateway:
    profiles: [core, full]
    image: swipeline-gateway:m2
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://gateway:gateway-local@postgres:5432/gateway?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      GOMEMLIMIT: 192MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_GATEWAY_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, /gateway, health]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  flink-jobmanager:
    profiles: [core, full]
    image: swipeline-streaming:m2
    build:
      context: .
      dockerfile: deploy/streaming.Dockerfile
    mem_limit: 512m
    entrypoint: [sh, /opt/swipeline/flink-start.sh]
    command: [standalone-job, --job-classname, io.swipeline.Authorization]
    environment:
      KAFKA_BROKERS: kafka:9092
      AUTH_PARALLELISM: "2"
      CANON_PARALLELISM: "1"
      AUTH_BUFFER_TIMEOUT_MS: "${SWIPELINE_AUTH_BUFFER_TIMEOUT_MS:-0}"
      FLINK_PROPERTIES: "${SWIPELINE_FLINK_PROPERTIES:-}"
    volumes:
      - flink-state:/state
    ports:
      - "127.0.0.1:${SWIPELINE_FLINK_PORT:-8082}:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          job=$$(curl -fsS --max-time 2 http://127.0.0.1:8081/jobs/overview |
          grep -oE '\{[^{}]*"name"[[:space:]]*:[[:space:]]*"authorization"[^{}]*\{[^{}]*\}[^{}]*\}') &&
          printf '%s\n' "$$job" | grep -qE '"state"[[:space:]]*:[[:space:]]*"RUNNING"' &&
          for state in created scheduled deploying initializing reconciling; do
            printf '%s\n' "$$job" | grep -qE "\"$$state\"[[:space:]]*:[[:space:]]*0[[:space:]]*[,}]" || exit 1;
          done
      interval: 2s
      timeout: 3s
      start_period: 120s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  flink-taskmanager:
    profiles: [core, full]
    image: swipeline-streaming:m2
    mem_limit: 1536m
    command: [taskmanager]
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - flink-state:/state
    depends_on:
      flink-jobmanager:
        condition: service_started
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  seaweedfs:
    profiles: [core, full]
    image: chrislusf/seaweedfs:4.48
    mem_limit: 512m
    command: ["mini", "-dir=/data", "-bucket=swipeline", "-s3.port=8333", "-s3.config=/etc/seaweed-s3.json"]
    ports:
      - "127.0.0.1:${SWIPELINE_SEAWEED_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - type: bind
        source: ./deploy/seaweed-s3.json
        target: /etc/seaweed-s3.json
        read_only: true
        bind:
          selinux: z
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS --max-time 3 http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  spark-batch:
    profiles: [core, full]
    image: swipeline-spark:m4
    build:
      context: .
      dockerfile: deploy/spark.Dockerfile
    mem_limit: 2048m
    environment:
      SPARK_DRIVER_MEMORY: 1280m
      SPARK_EXECUTOR_MEMORY: 1280m
      S3_ENDPOINT: http://seaweedfs:8333
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: postgres://gateway:gateway-local@postgres:5432/gateway?sslmode=disable
    volumes:
      - spark-spill:/tmp/spark-spill
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-zk:
    profiles: [full]
    image: zookeeper:3.9.6
    mem_limit: 256m
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      JVMFLAGS: "-Xms128m -Xmx128m"
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-coordinator-overlord:
    profiles: [full]
    image: apache/druid:38.0.0
    command: [coordinator]
    mem_limit: 512m
    env_file: deploy/druid.env
    environment:
      druid_coordinator_asOverlord_enabled: "true"
      druid_coordinator_asOverlord_overlordService: druid/overlord
      DRUID_XMX: 256m
      DRUID_XMS: 256m
      DRUID_MAXDIRECTMEMORYSIZE: 64m
    volumes:
      - druid-shared:/opt/shared
    depends_on:
      postgres:
        condition: service_healthy
      druid-zk:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O - http://127.0.0.1:8081/status/health | grep -q true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-broker:
    profiles: [full]
    image: apache/druid:38.0.0
    command: [broker]
    mem_limit: 512m
    env_file: deploy/druid.env
    environment:
      DRUID_XMX: 256m
      DRUID_XMS: 256m
      DRUID_MAXDIRECTMEMORYSIZE: 160m
      druid_processing_buffer_sizeBytes: "50000000"
    depends_on:
      druid-zk:
        condition: service_healthy
      druid-coordinator-overlord:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O - http://127.0.0.1:8082/status/health | grep -q true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-historical:
    profiles: [full]
    image: apache/druid:38.0.0
    command: [historical]
    mem_limit: 1024m
    env_file: deploy/druid.env
    environment:
      DRUID_XMX: 384m
      DRUID_XMS: 384m
      DRUID_MAXDIRECTMEMORYSIZE: 400m
      druid_processing_buffer_sizeBytes: 50000000
      druid_segmentCache_locations: '[{"path":"/opt/druid/var/segment-cache","maxSize":2000000000}]'
    volumes:
      - druid-shared:/opt/shared
      - druid-cache:/opt/druid/var
    depends_on:
      druid-zk:
        condition: service_healthy
      druid-coordinator-overlord:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O - http://127.0.0.1:8083/status/health | grep -q true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-middlemanager:
    profiles: [full]
    image: apache/druid:38.0.0
    command: [middleManager]
    mem_limit: 1792m
    env_file: deploy/druid.env
    environment:
      DRUID_XMX: 128m
      DRUID_XMS: 128m
      druid_worker_capacity: "2"
      druid_indexer_runner_javaOptsArray: '["-server","-Xms256m","-Xmx256m","-XX:MaxDirectMemorySize=256m"]'
      druid_indexer_fork_property_druid_processing_buffer_sizeBytes: "25000000"
    volumes:
      - druid-shared:/opt/shared
    depends_on:
      druid-zk:
        condition: service_healthy
      druid-coordinator-overlord:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O - http://127.0.0.1:8091/status/health | grep -q true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  druid-router:
    profiles: [full]
    image: apache/druid:38.0.0
    command: [router]
    mem_limit: 256m
    env_file: deploy/druid.env
    environment:
      DRUID_XMX: 128m
      DRUID_XMS: 128m
      druid_router_managementProxy_enabled: "true"
    ports:
      - "127.0.0.1:${SWIPELINE_DRUID_PORT:-8888}:8888"
    depends_on:
      druid-zk:
        condition: service_healthy
      druid-coordinator-overlord:
        condition: service_healthy
      druid-broker:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O - http://127.0.0.1:8888/status/health | grep -q true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  analytics-bootstrap:
    profiles: [full]
    image: swipeline-replayer:m1
    restart: "no"
    mem_limit: 128m
    command:
      - bootstrap
      - --druid
      - http://druid-router:8888
      - --spec
      - /etc/swipeline/supervisor.json
      - --wait
      - 5m
    volumes:
      - type: bind
        source: ./deploy/druid/supervisor.json
        target: /etc/swipeline/supervisor.json
        read_only: true
        bind:
          selinux: z
    depends_on:
      druid-router:
        condition: service_healthy
      druid-coordinator-overlord:
        condition: service_healthy
      kafka:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  superset:
    profiles: [full]
    image: swipeline-superset:m3
    restart: on-failure
    mem_limit: 768m
    command: ["/app/init.sh"]
    ports:
      - "127.0.0.1:${SWIPELINE_SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset-secrets:/secrets
    depends_on:
      postgres:
        condition: service_healthy
      analytics-bootstrap:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8088/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  preview-data:
  prometheus-data:
  postgres-data:
  kafka-data:
  flink-state:
  druid-shared:
  druid-cache:
  superset-secrets:
  seaweedfs-data:
  spark-spill:
