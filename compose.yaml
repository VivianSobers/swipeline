services:
  replayer:
    profiles: [core]
    image: swipeline-replayer:m1
    build:
      context: .
      dockerfile: deploy/replayer.Dockerfile
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - preview-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, /swipeline, health]
      interval: 2s
      timeout: 4s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  prometheus:
    profiles: [core]
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:${SWIPELINE_PROM_PORT:-9090}:9090"
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      replayer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
configs:
  prometheus-config:
    file: ./deploy/prometheus.yml
volumes:
  preview-data:
  prometheus-data:
