services:
  replayer:
    profiles: [core, full]
    image: swipeline-replayer:m1
    build:
      context: .
      dockerfile: deploy/replayer.Dockerfile
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${SWIPELINE_HTTP_PORT:-8080}:8080"
    volumes:
      - preview-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: [CMD, /swipeline, health]
      interval: 2s
      timeout: 4s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  prometheus:
    profiles: [core, full]
    image: prom/prometheus:v3.15.0
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    ports:
      - "127.0.0.1:${SWIPELINE_PROM_PORT:-9090}:9090"
    volumes:
      - type: bind
        source: ./deploy/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          selinux: z
      - prometheus-data:/prometheus
    depends_on:
      replayer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  postgres:
    profiles: [core, full]
    image: postgres:17.11-bookworm
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_PASSWORD: admin-local
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=32, -c, synchronous_commit=on]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/postgres-init.sql
        target: /docker-entrypoint-initdb.d/001-gateway.sql
        read_only: true
        bind:
          selinux: z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  preview-data:
  prometheus-data:
  postgres-data:
