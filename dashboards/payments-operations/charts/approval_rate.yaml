slice_name: Approval Rate
viz_type: big_number_total
params:
  adhoc_filters: []
  datasource: e4b3c2a1-0000-4000-8000-000000000002__table
  viz_type: big_number_total
  query_mode: sql
  sql: |
    SELECT
      CASE
        WHEN COUNT(*) = 0 THEN NULL
        ELSE CAST(SUM(CASE WHEN "decision" = 'APPROVE' THEN 1 ELSE 0 END) AS DOUBLE) / COUNT(*)
      END AS "approval_rate"
    FROM "swipeline_decisions"
    WHERE "run_id" = :run_id
query_context: null
cache_timeout: null
