slice_name: Freshness and Integrity
viz_type: table
params:
  adhoc_filters: []
  datasource: e4b3c2a1-0000-4000-8000-000000000002__table
  viz_type: table
  query_mode: sql
  sql: |
    SELECT
      MAX(__time) AS "max_time",
      (EXTRACT(EPOCH FROM CURRENT_TIMESTAMP) - EXTRACT(EPOCH FROM MAX(__time))) AS "ingestion_lag_seconds",
      COUNT(*) AS "total_count",
      CASE
        WHEN COUNT(*) = 0 THEN 0.0
        ELSE CAST(SUM(CASE WHEN "decision_source" = 'STAND_IN' THEN 1 ELSE 0 END) AS DOUBLE) / COUNT(*)
      END AS "standin_share"
    FROM "swipeline_decisions"
    WHERE "run_id" = :run_id
query_context: null
cache_timeout: null
uuid: e4b3c2a1-0000-4000-8000-000000000016
version: 1.0.0
